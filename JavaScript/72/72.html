<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HW 72</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 2em;
            background-color:white;
        }

        h1 {
            margin-bottom: 0.5em;
        }

        img {
            width: 400px;
        }

        #ingredients {
            list-style-type: none;
            padding: 0;
        }

        #ingredients li {
            margin: 4px 0;
        }

        select {
            font-size: 1em;
            padding: 0.3em;
            margin-bottom: 1em;
        }

        #recipe {
            margin-top: 2em;
        }

        #directions {
            max-width: 600px;
            margin: 1em auto;
            line-height: 1.5em;
        }
    </style>
</head>

<body>
    <h1>Choose a recipe:</h1>

    <select id="recipeSelect">
        <option value="">-- Select a recipe --</option>
    </select>

    <div id="recipe" style="display:none;">
        <h2 id="recipeName"></h2>
        <img id="recipeImage" src="" alt="Recipe Image">
        <h3>Ingredients:</h3>
        <ul id="ingredients"></ul>
        <h3>Directions:</h3>
        <p id="directions"></p>
    </div>

    <script src="72.js"></script>
</body>

</html>
